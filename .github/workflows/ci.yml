name: CI

# Checks on every push and pull request: .NET build + tests (Windows runner, because the Windows program targets net10.0-windows),
# the web UI (typecheck, lint, unit tests, build) and the Docker image (built without pushing, then started and health-checked).
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Windows program bundles the built web UI (and warns, which this repository treats as an error, when it is missing)
      - name: Build the web UI
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Build
        run: dotnet build Cv.slnx -c Release --nologo

      - name: Test
        run: dotnet test --solution Cv.slnx -c Release --no-build

  frontend:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read product name and version
        id: meta
        run: |
          echo "title=$(jq -r .name branding.json)" >> "$GITHUB_OUTPUT"
          if [ -f version.txt ]; then
            echo "version=$(sed -n 1p version.txt | tr -d '\r')" >> "$GITHUB_OUTPUT"
            echo "detail=$(sed -n 2p version.txt | tr -d '\r')" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0" >> "$GITHUB_OUTPUT"
            echo "detail=" >> "$GITHUB_OUTPUT"
          fi

      # Built without pushing anything; loaded into the runner's Docker so the next step can start it
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: app:ci
          build-args: |
            APP_TITLE=${{ steps.meta.outputs.title }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_VERSION_DETAIL=${{ steps.meta.outputs.detail }}
            APP_CHANNEL=dev
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image and wait for its health check
        run: |
          docker run -d --name app-ci -p 127.0.0.1:8080:8080 app:ci
          for _ in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' app-ci)"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker logs app-ci
          [ "$status" = "healthy" ] || { echo "Container is not healthy (status: $status)"; exit 1; }
          curl --fail --silent http://127.0.0.1:8080/api/version
          echo
          curl --fail --silent http://127.0.0.1:8080/ | grep -q "<title>"

      - name: Stop the container
        if: always()
        run: docker rm -f app-ci || true
