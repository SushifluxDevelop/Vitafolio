name: Release

# Four-tier push model (Dev, Nightly, Beta, Release):
#   Release (v2026.11.12)                -> Publishes public GitHub Release. Docker tags: <version>, :latest, :beta, :nightly
#   Beta (v2026.11.12.13.557-beta)       -> Publishes public GitHub Pre-Release. Docker tags: <version>, :beta, :nightly
#   Nightly (v2026.11.12.13.557-nightly) -> Publishes public GitHub Pre-Release. Docker tags: <version>, :nightly
#   Dev-Build (v2026.11.12.13.557-dev)   -> Private DRAFT GitHub Release (own testing only). Docker tags: <version>, :dev
#
# Docker tag hierarchy (Unraid CA branch channels, user rule 2026-11-07):
#   - Nightly-Build:                 version tag + :nightly
#   - Beta-Release:                  version tag + :beta + :nightly
#   - Release (Öffentlich / Stable): version tag + :latest + :beta + :nightly
#   - Dev-Build:                     version tag + :dev (rein privat / Draft)
#
# Platform scope: specified in annotated tag message: "platform: unraid", "platform: windows-desktop", "platform: all"
on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: ghcr.io/sushifluxdevelop/vitafolio

jobs:
  inspect:
    name: Inspect Tag and Determine Targets
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      is_beta: ${{ steps.version.outputs.is_beta }}
      is_nightly: ${{ steps.version.outputs.is_nightly }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      is_dev: ${{ steps.version.outputs.is_dev }}
      builds_unraid: ${{ steps.version.outputs.builds_unraid }}
      builds_windows: ${{ steps.version.outputs.builds_windows }}
      docker_tag: ${{ steps.version.outputs.docker_tag }}
      template_tag: ${{ steps.version.outputs.template_tag }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse tag and platform scope
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          is_beta=false
          is_nightly=false
          is_prerelease=false
          is_dev=false
          if [[ "$tag" == *-beta ]]; then
            is_beta=true
            is_prerelease=true
          elif [[ "$tag" == *-nightly ]]; then
            is_nightly=true
            is_prerelease=true
          elif [[ "$tag" == *-dev ]]; then
            is_dev=true
          elif [[ "$tag" == *-rc* ]]; then
            echo "::error::Release candidates were replaced by betas (tag v<year>.<month>.<commit>.<prompts>.<lines>-beta); $tag cannot be built any more"
            exit 1
          fi

          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}" || true
          platform="$(git tag -l --format='%(contents)' "$tag" | sed -n 's/^platform:[[:space:]]*//p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"

          builds_unraid=false
          builds_windows=false
          case ",${platform}," in
            ",,"|*,all,*)
              builds_unraid=true
              builds_windows=true
              ;;
            *)
              if [[ ",${platform}," == *,unraid,* ]]; then builds_unraid=true; fi
              if [[ ",${platform}," == *,windows-desktop,* || ",${platform}," == *,windows,* || ",${platform}," == *,windows-all,* ]]; then builds_windows=true; fi
              ;;
          esac

          echo "Build-Scope: platform='${platform:-all}' builds_unraid=$builds_unraid builds_windows=$builds_windows"

          target_label=""
          if [[ -z "$platform" || ",${platform}," == *,all,* ]]; then
            target_label="All"
          else
            IFS=',' read -ra ids <<< "$platform"
            for id in "${ids[@]}"; do
              case "$id" in
                unraid) name="Unraid" ;;
                windows-desktop|windows) name="Windows Desktop" ;;
                *) name="$id" ;;
              esac
              target_label="${target_label:+$target_label, }$name"
            done
          fi

          docker_tag="${tag#v}"
          template_tag="$docker_tag"
          if [[ "$is_beta" == "true" ]]; then template_tag="beta"; fi
          if [[ "$is_nightly" == "true" ]]; then template_tag="nightly"; fi
          if [[ "$is_dev" == "true" ]]; then template_tag="dev"; fi
          if [[ "$is_prerelease" == "false" && "$is_dev" == "false" ]]; then template_tag="latest"; fi

          {
            echo "tag=$tag"
            echo "is_beta=$is_beta"
            echo "is_nightly=$is_nightly"
            echo "is_prerelease=$is_prerelease"
            echo "is_dev=$is_dev"
            echo "builds_unraid=$builds_unraid"
            echo "builds_windows=$builds_windows"
            echo "docker_tag=$docker_tag"
            echo "template_tag=$template_tag"
            echo "release_name=$tag ($target_label)"
          } >> "$GITHUB_OUTPUT"

  docker:
    name: Build & Push Docker Image
    needs: inspect
    if: needs.inspect.outputs.builds_unraid == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.inspect.outputs.docker_tag }}
            ${{ needs.inspect.outputs.is_dev == 'true' && format('{0}:dev', env.IMAGE_NAME) || format('{0}:nightly', env.IMAGE_NAME) }}
            ${{ (needs.inspect.outputs.is_beta == 'true' || (needs.inspect.outputs.is_prerelease == 'false' && needs.inspect.outputs.is_dev == 'false')) && format('{0}:beta', env.IMAGE_NAME) || '' }}
            ${{ needs.inspect.outputs.is_prerelease == 'false' && needs.inspect.outputs.is_dev == 'false' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          build-args: |
            APP_TITLE=Vitafolio
            APP_VERSION=${{ needs.inspect.outputs.tag }}
            APP_CHANNEL=${{ needs.inspect.outputs.is_beta == 'true' && 'beta' || (needs.inspect.outputs.is_nightly == 'true' && 'nightly' || (needs.inspect.outputs.is_dev == 'true' && 'dev' || 'release')) }}
            VCS_REF=${{ github.sha }}

      - name: Render Unraid template
        run: |
          sed "s/__VERSION__/${{ needs.inspect.outputs.template_tag }}/g" \
            unraid/vitafolio.xml.template > unraid/vitafolio.xml

      - name: Upload Unraid template artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: unraid-template
          path: unraid/vitafolio.xml

      - name: Attach Unraid template to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.inspect.outputs.tag }}
          name: ${{ needs.inspect.outputs.release_name }}
          draft: true
          prerelease: ${{ needs.inspect.outputs.is_prerelease }}
          files: unraid/vitafolio.xml

  windows:
    name: Build Windows Desktop Installer
    needs: inspect
    if: needs.inspect.outputs.builds_windows == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund --no-audit

      - name: Build Windows installer
        shell: powershell
        run: |
          $flag = if ('${{ needs.inspect.outputs.is_beta }}' -eq 'true') { '-Beta' } elseif ('${{ needs.inspect.outputs.is_nightly }}' -eq 'true') { '-Nightly' } elseif ('${{ needs.inspect.outputs.is_dev }}' -eq 'true') { '-Dev' } else { '' }
          if ($flag) {
            .\scripts\build-windows.ps1 $flag
          } else {
            .\scripts\build-windows.ps1
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows-release
          path: artifacts/windows/*

      - name: Attach Windows artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.inspect.outputs.tag }}
          name: ${{ needs.inspect.outputs.release_name }}
          draft: true
          prerelease: ${{ needs.inspect.outputs.is_prerelease }}
          files: artifacts/windows/*

  publish:
    name: Finalize GitHub Release
    needs: [inspect, docker, windows]
    if: always() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.inspect.outputs.tag }}
          IS_PRERELEASE: ${{ needs.inspect.outputs.is_prerelease }}
          IS_DEV: ${{ needs.inspect.outputs.is_dev }}
        run: |
          if [[ "$IS_DEV" == "true" ]]; then
            echo "Dev build remains draft."
            exit 0
          fi
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isDraft,isPrerelease,url --jq '"\(.name): draft=\(.isDraft) prerelease=\(.isPrerelease) \(.url)"'